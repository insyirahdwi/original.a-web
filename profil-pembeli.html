<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Profil Pembeli — Original.A</title>
<link rel="stylesheet" href="style.css"/>
<style>
  body { background:var(--cream); }
  .progress-wrap { padding:36px 20px 0; max-width:780px; margin:0 auto; text-align:center; }
  .progress-lbl { font-size:0.78rem; letter-spacing:0.16em; color:var(--gold); font-weight:700; margin-bottom:14px; }
  .progress-bar { height:4px; background:var(--border); border-radius:3px; overflow:hidden; }
  .progress-bar > span { display:block; height:100%; width:100%; background:var(--green); }

  .form-wrap { max-width:780px; margin:40px auto 60px; padding:0 20px; }
  .form-card {
    background:var(--white); border:1px solid var(--border-light);
    border-radius:var(--radius-lg); padding:48px;
  }
  .form-card h1 { text-align:center; font-size:2rem; margin-bottom:8px; }
  .form-card .lead { text-align:center; color:var(--text-mid); font-size:0.95rem; margin-bottom:36px; }

  .avatar-up { display:flex; flex-direction:column; align-items:center; margin-bottom:32px; }
  .avatar-circle {
    width:110px; height:110px; border-radius:50%; background:var(--cream-dark);
    border:2px dashed #c7bfae; display:flex; align-items:center; justify-content:center;
    color:var(--text-muted); font-size:1.6rem; position:relative; cursor:pointer;
    background-size: cover; background-position: center;
  }
  .avatar-edit {
    position:absolute; bottom:4px; right:4px; width:28px; height:28px; background:var(--green);
    border-radius:50%; color:var(--white); display:flex; align-items:center; justify-content:center; font-size:0.75rem;
  }
  .avatar-up p { margin-top:10px; font-size:0.85rem; color:var(--text-mid); }

  .row { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:18px; }
  .row.three { grid-template-columns:1fr 1fr 1fr; }
  .field label { display:block; font-size:0.88rem; font-weight:600; color:var(--text-dark); margin-bottom:8px; }
  .field input, .field select, .field textarea {
    width:100%; padding:13px 14px; background:var(--cream-dark); border:1px solid transparent;
    border-radius:var(--radius-sm); font-family:var(--font-body); font-size:0.92rem; color:var(--text-dark); outline:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color:var(--green); background:var(--white); }
  .field textarea { min-height:90px; resize:vertical; }
  .gender-toggle { display:grid; grid-template-columns:1fr 1fr; gap:0; background:var(--cream-dark); padding:4px; border-radius:var(--radius-sm); }
  .gender-toggle button { padding:11px; background:transparent; border-radius:6px; font-weight:600; color:var(--text-mid); font-size:0.9rem; }
  .gender-toggle button.active { background:var(--white); color:var(--green); box-shadow:var(--shadow-sm); }

  .actions { text-align:center; margin-top:36px; }
  .actions .btn { padding:15px 48px; font-size:0.95rem; }
  .skip { display:block; margin-top:14px; color:var(--text-mid); font-size:0.85rem; }

  footer.mini { background:var(--cream-dark); padding:24px 0; border-top:1px solid var(--border); }
  footer.mini .row-foot { display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; font-size:0.82rem; color:var(--text-mid); }
  footer.mini .row-foot strong { color:var(--green); font-family:var(--font-display); }
  footer.mini .row-foot a { color:var(--text-mid); margin-right:18px; }

  @media(max-width:700px){
    .row, .row.three { grid-template-columns:1fr; }
    .form-card { padding:30px 22px; }
  }
</style>
</head>
<body>

<div class="progress-wrap">
  <div class="progress-lbl">LANGKAH 1 DARI 1</div>
  <div class="progress-bar"><span></span></div>
</div>

<div class="form-wrap">
  <form id="profileForm" class="form-card">
    <h1>Halo, <span id="displayUserName">Pembeli</span>!</h1>
    <p class="lead">Satu langkah lagi untuk melengkapi profil Anda.</p>

    <div class="avatar-up">
      <div class="avatar-circle" id="profileAvatar" onclick="document.getElementById('avatarInput').click();">
        <span id="avatarPlaceholder">📷</span>
        <div class="avatar-edit">✎</div>
      </div>
      <input type="file" id="avatarInput" accept="image/*" style="display:none;"/>
      <p>Unggah Foto Profil</p>
    </div>

    <div class="field" style="margin-bottom:18px;">
      <label>Nama Lengkap</label>
      <input type="text" id="inputName" placeholder="Masukkan nama lengkap Anda" required/>
    </div>

    <div class="field" style="margin-bottom:18px;">
      <label>Email</label>
      <input type="email" id="inputEmail" placeholder="email@contoh.com" required/>
    </div>

    <div class="row">
      <div class="field">
        <label>Tanggal Lahir</label>
        <input type="date" id="inputBirthDate"/>
      </div>
      <div class="field">
        <label>Jenis Kelamin</label>
        <div class="gender-toggle" id="genderToggle">
          <button type="button" class="active" data-gender="Pria">Pria</button>
          <button type="button" data-gender="Wanita">Wanita</button>
        </div>
      </div>
    </div>

    <div class="field" style="margin-bottom:18px;">
      <label>Alamat Pengiriman Utama</label>
      <textarea id="inputAddress" placeholder="Nama Jalan, No. Rumah, RT/RW"></textarea>
    </div>

    <div class="row three">
      <div class="field">
        <label>Provinsi</label>
        <select id="selectProvinsi">
          <option value="">Pilih Provinsi</option>
          <option>Aceh</option>
          <option>Bali</option>
          <option>Banten</option>
          <option>Bengkulu</option>
          <option>DI Yogyakarta</option>
          <option>DKI Jakarta</option>
          <option>Gorontalo</option>
          <option>Jambi</option>
          <option>Jawa Barat</option>
          <option>Jawa Tengah</option>
          <option>Jawa Timur</option>
          <option>Kalimantan Barat</option>
          <option>Kalimantan Selatan</option>
          <option>Kalimantan Tengah</option>
          <option>Kalimantan Timur</option>
          <option>Kalimantan Utara</option>
          <option>Kepulauan Bangka Belitung</option>
          <option>Kepulauan Riau</option>
          <option>Lampung</option>
          <option>Maluku</option>
          <option>Maluku Utara</option>
          <option>Nusa Tenggara Barat</option>
          <option>Nusa Tenggara Timur</option>
          <option>Papua</option>
          <option>Papua Barat</option>
          <option>Papua Pegunungan</option>
          <option>Papua Selatan</option>
          <option>Papua Tengah</option>
          <option>Papua Barat Daya</option>
          <option>Riau</option>
          <option>Sulawesi Barat</option>
          <option>Sulawesi Selatan</option>
          <option>Sulawesi Tengah</option>
          <option>Sulawesi Tenggara</option>
          <option>Sulawesi Utara</option>
          <option>Sumatera Barat</option>
          <option>Sumatera Selatan</option>
          <option>Sumatera Utara</option>
        </select>
      </div>
      <div class="field">
        <label>Kota</label>
        <select id="selectKota"><option value="">Pilih Kota</option></select>
      </div>
      <div class="field">
        <label>Kode Pos</label>
        <input type="text" id="inputZip" placeholder="12345"/>
      </div>
    </div>

    <div class="actions">
      <button type="submit" class="btn btn-primary">Mulai Belanja →</button>
      <a href="index-loggedin.html" class="skip">Lewati, isi nanti</a>
    </div>
  </form>
</div>

<footer class="mini">
  <div class="container">
    <div class="row-foot">
      <strong>Original.A</strong>
      <div>
        <a href="#">Privacy Policy</a>
        <a href="#">Terms of Craftsmanship</a>
        <a href="#">Help Center</a>
      </div>
      <span>© 2024 Original.A — The Curated Heritage of Indonesia. All rights reserved.</span>
    </div>
  </div>
</footer>

<script>
  // Data Kota per Provinsi (Contoh populer untuk memperlengkap)
  const cityData = {
    "Aceh": ["Banda Aceh", "Lhokseumawe", "Sabang", "Meulaboh", "Langsa"],
    "Bali": ["Denpasar", "Kuta", "Ubud", "Singaraja", "Tabanan"],
    "Banten": ["Tangerang", "Serang", "Cilegon", "Tangerang Selatan", "Pandeglang"],
    "DI Yogyakarta": ["Yogyakarta", "Sleman", "Bantul", "Kulon Progo", "Gunungkidul"],
    "DKI Jakarta": ["Jakarta Pusat", "Jakarta Utara", "Jakarta Barat", "Jakarta Selatan", "Jakarta Timur"],
    "Jawa Barat": ["Bandung", "Bekasi", "Depok", "Bogor", "Cimahi", "Tasikmalaya", "Cirebon"],
    "Jawa Tengah": ["Semarang", "Surakarta", "Magelang", "Pekalongan", "Salatiga", "Tegal"],
    "Jawa Timur": ["Surabaya", "Malang", "Batu", "Kediri", "Madiun", "Mojokerto", "Pasuruan", "Probolinggo"],
    "Sumatera Utara": ["Medan", "Binjai", "Pematangsiantar", "Tanjungbalai", "Tebing Tinggi"],
    "Sumatera Barat": ["Padang", "Bukittinggi", "Payakumbuh", "Solok"],
    "Riau": ["Pekanbaru", "Dumai"],
    "Kepulauan Riau": ["Batam", "Tanjungpinang"],
    "Lampung": ["Bandar Lampung", "Metro"],
    "Sulawesi Selatan": ["Makassar", "Palopo", "Parepare"],
    "Sulawesi Utara": ["Manado", "Bitung", "Tomohon"],
    "Kalimantan Timur": ["Samarinda", "Balikpapan", "Bontang"],
    "Kalimantan Selatan": ["Banjarmasin", "Banjarbaru"],
    "Nusa Tenggara Barat": ["Mataram", "Bima"],
    "Nusa Tenggara Timur": ["Kupang"],
    "Papua": ["Jayapura"]
  };

  const provSelect = document.getElementById('selectProvinsi');
  const citySelect = document.getElementById('selectKota');
  const avatarInput = document.getElementById('avatarInput');
  const profileAvatar = document.getElementById('profileAvatar');
  const avatarPlaceholder = document.getElementById('avatarPlaceholder');
  let currentAvatarData = null;

  avatarInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(event) {
        currentAvatarData = event.target.result;
        profileAvatar.style.backgroundImage = `url(${currentAvatarData})`;
        avatarPlaceholder.style.display = 'none';
        profileAvatar.style.borderStyle = 'solid';
        profileAvatar.style.borderColor = 'var(--border)';
      };
      reader.readAsDataURL(file);
    }
  });

  provSelect.addEventListener('change', function() {
    const prov = this.value;
    citySelect.innerHTML = '<option value="">Pilih Kota</option>';
    
    if (cityData[prov]) {
      cityData[prov].forEach(city => {
        const opt = document.createElement('option');
        opt.value = city;
        opt.textContent = city;
        citySelect.appendChild(opt);
      });
    } else if (prov) {
      // Jika data kota tidak ada di mapping, beri opsi default atau input manual
      const opt = document.createElement('option');
      opt.value = "Lainnya";
      opt.textContent = "Lainnya (Pilih Provinsi lain atau Hubungi Kami)";
      citySelect.appendChild(opt);
    }
  });

  let selectedGender = "Pria";
  document.querySelectorAll('.gender-toggle button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.gender-toggle button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      selectedGender = b.getAttribute('data-gender');
    });
  });

  const profileForm = document.getElementById('profileForm');
  profileForm.addEventListener('submit', function(e) {
    e.preventDefault();
    
    // Ambil data dari form
    const userData = {
      name: document.getElementById('inputName').value,
      email: document.getElementById('inputEmail').value,
      birthDate: document.getElementById('inputBirthDate').value,
      gender: selectedGender,
      address: document.getElementById('inputAddress').value,
      province: provSelect.value,
      city: citySelect.value,
      zip: document.getElementById('inputZip').value,
      avatar: currentAvatarData
    };

    // Simpan ke localStorage
    localStorage.setItem('oa_user', JSON.stringify(userData));
    
    // Redirect
    window.location.href = 'index-loggedin.html';
  });

  /* ---- CEK STATUS LOGIN & PRE-FILL ---- */
  (function() {
    const u = localStorage.getItem('oa_user');
    if (u) {
      try {
        const d = JSON.parse(u);
        if (d.name) {
          document.getElementById('displayUserName').textContent = d.name;
          document.getElementById('inputName').value = d.name;
          
          if (!d.avatar) {
            // Set initials in profile avatar only if no image
            const initials = d.name.substring(0, 2).toUpperCase();
            profileAvatar.innerHTML = `<span id="avatarPlaceholder">${initials}</span><div class="avatar-edit">✎</div>`;
            profileAvatar.style.fontSize = '2rem';
            profileAvatar.style.fontWeight = '700';
            profileAvatar.style.color = 'var(--green)';
            profileAvatar.style.borderStyle = 'solid';
            profileAvatar.style.borderColor = 'var(--border)';
          }
        }
        if (d.avatar) {
          currentAvatarData = d.avatar;
          profileAvatar.style.backgroundImage = `url(${d.avatar})`;
          const ph = document.getElementById('avatarPlaceholder');
          if (ph) ph.style.display = 'none';
          profileAvatar.style.borderStyle = 'solid';
          profileAvatar.style.borderColor = 'var(--border)';
        }
        if (d.email) {
          document.getElementById('inputEmail').value = d.email;
        }
        if (d.address) document.getElementById('inputAddress').value = d.address;
        if (d.zip) document.getElementById('inputZip').value = d.zip;
        if (d.birthDate) document.getElementById('inputBirthDate').value = d.birthDate;
        
        if (d.province) {
          provSelect.value = d.province;
          provSelect.dispatchEvent(new Event('change'));
          if (d.city) citySelect.value = d.city;
        }
      } catch (e) { console.error("Error parsing user data", e); }
    }
  })();
</script>
<script src="cart.js"></script>
</body>
</html>
